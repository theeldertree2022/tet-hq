<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TET HQ | The Elder Tree</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#4a5662">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TET HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
  html,body{margin:0;height:100%;background:#eeeeeb;font-family:Georgia,'Times New Roman',serif;color:#3d454d}
  #app{position:fixed;left:0;right:0;bottom:0;top:env(safe-area-inset-top);width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#eeeeeb}
  #bar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:5;background:#4a5662;color:#eeeeeb;border-radius:14px;padding:12px 14px;
       display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:15px;line-height:1.35;max-width:560px;margin:0 auto}
  #bar[hidden]{display:none}
  #bar .msg{flex:1}
  #bar button{border:0;border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
  #yes{background:#d8d081;color:#3d454d}
  #no{background:transparent;color:#eeeeeb;text-decoration:underline;padding:8px 4px!important}
  #setup{display:none;max-width:520px;margin:12vh auto;padding:24px;text-align:center}
</style>
</head>
<body>
<iframe id="app" title="TET HQ" allow="clipboard-write"></iframe>
<div id="setup"><img src="icon-192.png" width="96" alt=""><h2>TET HQ</h2><p>This app isn't connected yet. Open <b>index.html</b> and paste the HQ web app link where it says APP_URL.</p></div>
<div id="bar" hidden role="dialog" aria-live="polite">
  <span class="msg" id="msg"></span>
  <button id="yes" type="button">Turn on</button>
  <button id="no" type="button">Not now</button>
</div>

<script>
/* ===== Paste your two settings here (see SETUP.md) ===== */
var APP_URL = 'https://script.google.com/macros/s/AKfycbw4yO4YqRKZFSs_hNB5D2I9OHsKi1KOf-ARwaNKd1Mcwjv7MICwJDpPqiFixT4KKsK5/exec';
var ONESIGNAL_APP_ID = '6aa0f5e0-ce30-472a-9d52-b38230a58704';
/* ======================================================= */

var frame = document.getElementById('app'), bar = document.getElementById('bar'), msg = document.getElementById('msg');
var userId = null, OS = null, mode = null;
var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var installed = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

if (/^https:\/\/script\.google\.com\//.test(APP_URL)) {
  /* Load HQ's page straight from its server without Google sign-in cookies, so phones signed in
     to several Google accounts don't get "unable to open the file". Falls back to the old way. */
  fetch(APP_URL + '?raw=1', { credentials: 'omit', redirect: 'follow' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) { if (html.indexOf('<html') < 0 && html.indexOf('<!DOCTYPE') < 0) throw new Error('bad'); frame.srcdoc = html; })
    .catch(function () { frame.src = APP_URL; });
}
else { frame.style.display = 'none'; document.getElementById('setup').style.display = 'block'; }

function dismissed() { try { return Date.now() - Number(localStorage.getItem('tetBellNo') || 0) < 7 * 86400000; } catch (e) { return false; } }
function hide() { bar.hidden = true; }
function show(text, how) { if (dismissed()) return; msg.textContent = text; mode = how; document.getElementById('yes').style.display = how === 'ios' ? 'none' : ''; bar.hidden = false; }

function refreshBar() {
  if (!userId) return hide();
  if (isIOS && !installed) return show('To get pop-up reminders on your iPhone: tap Share, then "Add to Home Screen", then open TET HQ from your home screen.', 'ios');
  if (!('Notification' in window) || !OS) return hide();
  if (Notification.permission === 'default') return show('Get pop-up reminders for your tasks, events and handover notes on this device?', 'ask');
  hide();
}

window.OneSignalDeferred = window.OneSignalDeferred || [];
if (!/PASTE_/.test(ONESIGNAL_APP_ID)) {
  OneSignalDeferred.push(async function (OneSignal) {
    var base = location.pathname.replace(/[^/]*$/, '');
    try {
      await OneSignal.init({ appId: ONESIGNAL_APP_ID, safari_web_id: 'web.onesignal.auto.10bba952-d3e6-4be7-b269-bd5caae877a4', serviceWorkerPath: base.slice(1) + 'OneSignalSDKWorker.js',
        serviceWorkerParam: { scope: base }, notifyButton: { enable: false } });
      OS = OneSignal;
      if (userId) await OS.login(userId);
    } catch (e) { console.log('Notifications unavailable', e); }
    refreshBar();
  });
}

/* HQ (inside the frame) tells us who has signed in, so pop-ups reach the right person */
window.addEventListener('message', function (e) {
  if (e.origin !== location.origin && !/(\.googleusercontent\.com|script\.google\.com)$/.test(new URL(e.origin).hostname)) return;
  var d = e.data || {};
  if (d.tetHQ === 'user' && d.id) { userId = d.id; if (OS) OS.login(userId); refreshBar(); }
  if (d.tetHQ === 'logout') { userId = null; if (OS) OS.logout(); hide(); }
});

/* Back button: HQ switches screens inside the frame, so the browser never knew about them.
   Record each screen change in this page's history, and go back a screen when Back is pressed. */
(function () {
  var restoring = false, lastKey = null;
  function W() { return frame.contentWindow; }
  function snap(S) { return { v: S.view, p: S.page || null, t: S.teamOpen || '', c: (S.chat && S.chat.ch) || '' }; }
  function key(s) { return [s.v, s.p, s.t, s.c].join('|'); }
  function hook() {
    var w = W();
    if (!w || typeof w.render !== 'function' || !w.S || w.__tetBack) return false;
    w.__tetBack = true;
    var orig = w.render;
    w.render = function () {
      var r = orig.apply(this, arguments);
      try {
        var s = snap(w.S), k = key(s);
        if (k !== lastKey) {
          if (lastKey === null) history.replaceState({ tet: s }, '');
          else if (!restoring) history.pushState({ tet: s }, '');
          lastKey = k;
        }
      } catch (e) {}
      return r;
    };
    try { var s0 = snap(w.S); lastKey = key(s0); history.replaceState({ tet: s0 }, ''); } catch (e) {}
    return true;
  }
  frame.addEventListener('load', function () {
    var n = 0, iv = setInterval(function () { if (hook() || ++n > 2400) clearInterval(iv); }, 500);
  });
  window.addEventListener('popstate', function (e) {
    var w = W(), s = e.state && e.state.tet;
    if (!w || !w.S || !s) return;
    restoring = true;
    try {
      w.S.page = s.p; w.S.editingPage = false; w.S.teamOpen = s.t;
      if (w.S.chat) w.S.chat.ch = s.c;
      lastKey = key(s);
      w.go(s.v);
    } catch (err) {}
    restoring = false;
  });
})();

document.getElementById('yes').onclick = async function () {
  hide();
  if (!OS) return;
  try { await OS.Notifications.requestPermission(); if (userId) await OS.login(userId); } catch (e) {}
};
document.getElementById('no').onclick = function () { try { localStorage.setItem('tetBellNo', String(Date.now())); } catch (e) {} hide(); };
</script>
</body>
</html>
